<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Office Calculators Dashboard</title>
    <link rel="stylesheet" href="styles.css?v=6">
    <style>
        .dashboard-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }
        .calc-card {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 500px;
            text-decoration: none;
            color: #333;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
            box-sizing: border-box;
        }
        .calc-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            border-color: var(--primary-color);
        }
        .calc-card h3 {
            margin-top: 0;
            color: var(--primary-color);
            text-transform: uppercase;
        }
        .calc-card p {
            color: #666;
            margin-bottom: 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container" style="text-align: center; margin-top: 30px; background: transparent; box-shadow: none;">
        <div style="display: flex; justify-content: center; margin-bottom: 20px;">
            <img src="https://upload.wikimedia.org/wikipedia/en/3/32/India_Post.svg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" alt="India Post Logo" style="height: 80px;">
        </div>
        <h1 style="color: var(--primary-color); margin-bottom: 5px; text-transform: uppercase;">Post Office Tools</h1>
        <p style="color: #555;">Select a calculator to get started</p>
    </div>

    <div class="dashboard-container">
        <a href="pages/HIARM/index.html" class="calc-card">
            <h3>SCSS HIARM Calculator</h3>
            <p>Calculate system recovery and admissible interest for closed SCSS accounts due to death.</p>
        </a>
        <a href="pages/PLI/index.html" class="calc-card">
            <h3>PLI Calculator</h3>
            <p>Generate Endowment Assurance (Santosh) premium options and maturity estimates.</p>
        </a>
    </div>
</body>
</html>
